name: Windows source checks

on:
  push:
  pull_request:

jobs:
  source-checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and run offline tests
        shell: pwsh
        run: ./scripts/test.ps1
